name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: brew install swiftlint xcodegen
      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging
      - name: Xcode project matches project.yml
        run: |
          xcodegen generate
          # A warning rather than a failure: different XcodeGen versions can emit cosmetically different projects.
          git diff --quiet -- PayrollRTI.xcodeproj ||
            echo "::warning::PayrollRTI.xcodeproj differs from project.yml. Run 'xcodegen generate' and commit the result."

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: |
          set -o pipefail
          xcodebuild test \
            -project PayrollRTI.xcodeproj -scheme PayrollRTI \
            -destination "platform=macOS" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- | xcbeautify --renderer github-actions
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: build/TestResults.xcresult
