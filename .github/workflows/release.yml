name: Release

# Tags publish a GitHub release. Pushes to main (merged PRs) that change the app, and manual runs, build the same
# signed, notarised DMG and keep it as a workflow artifact for testing. GitHub doesn't apply path filters to tag
# pushes, so tagged releases always build.
on:
  push:
    tags: ["v*.*.*"]
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - PayrollRTITests/**
      - .github/workflows/ci.yml
      - .swiftlint.yml
      - .swift-format
      - scripts/format.sh
      - scripts/make-fake-bpt.sh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    env:
      APPLE_DEV_ID_CERT_P12: ${{ secrets.APPLE_DEV_ID_CERT_P12 }}
      APPLE_DEV_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEV_ID_CERT_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check secrets
        run: |
          missing=""
          for name in APPLE_DEV_ID_CERT_P12 APPLE_DEV_ID_CERT_PASSWORD APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See 'Release pipeline setup' in README.md."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build the native runtime for HMRC's Linux build
        # Embedded by the "Embed Linux build runtime" phase; without it the Linux engine is unavailable in the app.
        run: |
          brew install jpeg-turbo
          sh rehost/build-runtime.sh

      - name: Import Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          echo "$APPLE_DEV_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$APPLE_DEV_ID_CERT_PASSWORD" \
            -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          security find-identity -v -p codesigning "$keychain"

      - name: Write App Store Connect API key
        run: echo "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Choose version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-main.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign, package and notarise
        env:
          NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: scripts/release.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      - name: Upload DMG artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: PayrollRTI-${{ steps.version.outputs.version }}
          path: |
            build/release/PayrollRTI-*.dmg
            build/release/PayrollRTI-*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Write changelog
        if: github.ref_type == 'tag'
        run: |
          # A release's notes run from the previous release, skipping pre-releases (which may sit on the same
          # commit); a pre-release's notes run from whatever came last.
          exclude=()
          case "$GITHUB_REF_NAME" in *-*) ;; *) exclude=(--exclude 'v*-*') ;; esac
          previous="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${exclude[@]}" "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          range="${previous:+$previous..}$GITHUB_REF_NAME"
          {
            echo "## What's changed"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
            echo
            echo "Runs HMRC's free [Basic PAYE Tools](https://www.gov.uk/basic-paye-tools): either their Mac installer in /Applications, or their Linux build, which PayrollRTI downloads and runs natively on Apple silicon."
            case "$GITHUB_REF_NAME" in *-*)
              echo
              echo "**Pre-release for testing.** Your payroll data is backed up before anything changes it, but please keep your own backup too and report problems in the issues." ;;
            esac
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            fi
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a pre-release suffix (v0.2.0-beta.1) is published as a pre-release, so it never shows as Latest.
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            build/release/PayrollRTI-*.dmg build/release/PayrollRTI-*.dmg.sha256 \
            --title "PayrollRTI ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag "${prerelease[@]}"

      - name: Tell the website
        # A release created with the workflow's own token doesn't raise a `release` event for other workflows
        # (GitHub's loop guard), so notify-site.yml never sees it. Send the same dispatch from here instead;
        # notify-site.yml still covers releases published by hand.
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN isn't set; the website will pick this release up at its daily run."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            https://api.github.com/repos/seatofthepants-net/payrollrti-site/dispatches \
            -d '{"event_type":"payrollrti-release"}'

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"
